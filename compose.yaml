services:
  redis:
    image: redis:8-alpine
    container_name: movie-catalog-redis
    restart: unless-stopped

    labels:
      org.springframework.boot.ignore: "true"

    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    command:
      - /bin/sh
      - -c
      - |
        printf 'user default off\nuser %s on >%s ~movie-catalog::* &* +@all\n' \
          "$$REDIS_USERNAME" \
          "$$REDIS_PASSWORD" \
          > /tmp/users.acl

        exec redis-server \
          --appendonly yes \
          --aclfile /tmp/users.acl

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --user \"$$REDIS_USERNAME\" --pass \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data: